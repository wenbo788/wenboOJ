name: Deploy web to GitHub Pages

# 只部署前端（web/）。后端 API 与评测机仍在服务器上，
# 通过仓库变量 VITE_API_BASE_URL 指定（Settings → Secrets and variables → Actions → Variables）。
on:
  push:
    branches: [main, master]   # 按你的默认分支保留一个即可
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        env:
          # 项目页 /<repo>/；仓库名形如 <user>.github.io 或使用自定义域时改成 '/'
          PAGES_BASE: ${{ endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          # 空壳阶段留空：接口会请求 Pages 自身并 404；有后端后加仓库变量 VITE_API_BASE_URL。
          # 同时删掉下面的 VITE_SHELL_MODE，底部提示条才会消失。
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}
          VITE_SHELL_MODE: '1'
        run: |
          npm ci
          npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
