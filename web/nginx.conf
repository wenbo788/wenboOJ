# Jason227 OJ —— 前端 nginx 配置（容器内）
# 架构：nginx 托管 Vue 构建产物，并将 API 请求反代到后端容器 oj-service:8000
#
# 这份文件同时承担「第一道防线」：源站被打时最先撑不住的就是这一层
# （表现：TCP 能连上但 TLS 握手/响应迟迟不来，Cloudflare 只能报 522）。
# 所以这里有三件事必须做对：按真实 IP 限速限连、扫描路径直接断开、上游 keepalive。

# 客户端真实 IP：外层宝塔 nginx 以覆盖式 proxy_set_header X-Real-IP $remote_addr
# 注入真实客户端 IP（客户端伪造的同名头会被覆盖），这里透传给后端做按 IP 限量。
# 若直连本容器（本地调试，无宝塔层），回退用对端地址。
map $http_x_real_ip $oj_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# ===== 防滥用：按真实 IP 限速 / 限并发连接 =====
# 数值刻意放宽：学校、机房大量用户共用同一个出口 IP，按 IP 卡太死会误伤正常用户。
# 这一层只负责把「明显的洪水」挡在源站之外，真正的精细化在应用层
# （app/core/guard.py 的并发保护）。被单 IP 攻击时可临时收紧下面的数字。
limit_req_zone  $oj_client_ip zone=api_rate:10m  rate=50r/s;
limit_req_zone  $oj_client_ip zone=auth_rate:10m rate=10r/s;
limit_conn_zone $oj_client_ip zone=per_ip_conn:10m;
# 限流后的状态码是 502（不是 429）：429 等于告诉爬虫/扫描器「这里有限流，
# 按 Retry-After 隔几秒再来」，它退避一下还会继续；502 看起来像站点/网关挂了，
# 更劝退，也不暴露限流器的存在。与 app/core/guard.py 的 GUARD_RATE_STATUS
# 保持同一口径（那边默认也是 502）。
# 并发连接超限仍是 503：那确实是自己忙，不必撒谎。
limit_req_status  502;
limit_conn_status 503;

# 上游：keepalive 复用连接。默认每个请求都新建一次 TCP（还要走一遍容器网络），
# 高并发下会白吃掉源站的端口/FD，进而把握手也拖死。
upstream oj_backend {
    server oj-service:8000;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 30s;
}

server {
    # 纯 HTTP 监听：HTTPS 由外层宝塔 nginx（443，域名证书）统一终结后
    # 以 HTTP 反代到本容器（宿主 8888 -> 容器 80）。容器内不再做 SSL。
    listen 80;
    server_name _;

    # 不回显 nginx 版本号（少给扫描器一点信息）
    server_tokens off;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 慢连接保护：Slowloris 这类攻击靠「连上却慢慢发 header/body」占满 worker，
    # 把超时收紧可以让这些连接尽快被回收。
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          20s;
    keepalive_timeout     30s;
    keepalive_requests    1000;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（Vite 产物带内容哈希，可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 扫描器 / 探测路径：直接断开，不进后端、不返回 SPA =====
    # 本站是 Python/Vue，不提供任何 PHP/CGI 动态页面，也没有 .env/.git 可读；
    # 以前这类请求会命中 SPA 回退、白送一份 index.html + 前端包，既是负载也是信息泄漏。
    # 444 = 不回任何响应直接关连接（对扫描器最省资源）。
    location ~* \.(php\d?|phtml|asp|aspx|jsp|jspx|cgi|pl|sql|bak|old|orig|save|swp|swo|env|ini|log|lock|sqlite|db)$ {
        return 444;
    }
    location ~* ^/(\.(env|git|svn|hg|aws|ssh|htaccess|htpasswd|DS_Store)|wp-|phpmyadmin|pma|adminer|myadmin|xmlrpc|vendor/|node_modules/|cgi-bin/) {
        return 444;
    }

    # 通用代理头
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 透传宝塔注入的真实客户端 IP（不可用 $remote_addr 覆盖——那只是宝塔宿主地址）
    proxy_set_header X-Real-IP $oj_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 清空 Connection，upstream keepalive 才会生效（否则每个请求新建连接）
    proxy_set_header Connection "";
    # 连不上上游要**快速失败**：源站已经过载时，早点回 502 也比让 Cloudflare
    # 干等 30s 再报 522 好——快速失败至少能让 CF 立刻把错误呈现出来。
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    # 读超时保留 60s：自测/评测类请求确实可能跑得久
    proxy_read_timeout    60s;

    # ===== API 反代 =====
    # 管理后台等带 /api 前缀的请求：去掉 /api 转发（后端挂载在 /admin、/judgement 等）
    location /api/ {
        proxy_pass http://oj_backend/;
        # burst 给足：一个页面加载 + 轮询会有几十个请求，NAT 场景还要乘人数
        limit_req  zone=api_rate burst=200 nodelay;
        limit_conn per_ip_conn 64;
    }

    # 不带 /api 前缀的接口（登录/用户/犇犇/令牌）
    # 注意：不要代理 /judgement、/submissions —— 它们同时是前端路由
    location /auth/ {
        proxy_pass http://oj_backend;
        add_header Cache-Control "no-store";
        # 鉴权口是撞库/刷号的重点，单独一套更紧的额度
        limit_req  zone=auth_rate burst=60 nodelay;
        limit_conn per_ip_conn 24;
    }

    location /users/ {
        proxy_pass http://oj_backend;
        add_header Cache-Control "no-store";
        limit_req  zone=api_rate burst=200 nodelay;
        limit_conn per_ip_conn 64;
    }

    # 犇犇接口的请求路径为 /benben（无尾斜杠），location 不能带尾斜杠，
    # 否则不匹配并落到 SPA 回退导致发布失败
    location /benben {
        proxy_pass http://oj_backend;
        add_header Cache-Control "no-store";
        limit_req  zone=api_rate burst=200 nodelay;
        limit_conn per_ip_conn 64;
    }

    # 上传的静态文件（头像等）：一个页面可能并发拉几十张图，不加限速，
    # 但仍走 upstream keepalive 与超时设置
    location /static/ {
        proxy_pass http://oj_backend;
        expires 7d;
    }

    location /tokens/ {
        proxy_pass http://oj_backend;
        add_header Cache-Control "no-store";
        limit_req  zone=auth_rate burst=60 nodelay;
        limit_conn per_ip_conn 24;
    }

    # ===== otk-remote 协议接口（OierToolKit 拉题 / 提交 / 轮询）=====
    # 后端路由本身就是 /otk/v1/...（协议固定前缀，升版才会变 /otk/v2），
    # 所以 proxy_pass 必须**不带 URI**：写成 http://oj_backend/ 会把 /otk/
    # 前缀剥掉，后端只会 404。location 带尾斜杠，/otk/v1/... 由前缀匹配接住，
    # 未匹配的（比如根路径 /otk 本身）落到 SPA 回退也无妨。
    location /otk/ {
        proxy_pass http://oj_backend;
        add_header Cache-Control "no-store";
        # otk 客户端轮询约 2s 一次，单用户请求量很低；额度给到中档即可
        limit_req  zone=api_rate burst=100 nodelay;
        limit_conn per_ip_conn 32;
    }

    # 文件上传体积限制：批量导入测试点 ZIP 需要足够空间
    # 后端 API 自己限制在 50MB，因此这里放宽到 55MB，避免容器内 Nginx 先拦截。
    client_max_body_size 55m;

    # SPA history 路由回退：所有未匹配路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
