    <script>
      (function() {
        var officialHost = atob('bmxub2ouZ3IzeXBoNG50b20uY24='); 
        var currentHost = window.location.hostname;

        // 本地开发不跳转
        if (currentHost === 'localhost' || currentHost === '127.0.0.1' || currentHost === '::1') return;

        // GitHub Pages 预览站（https://<user>.github.io/<repo>/）不跳转，
        // 否则前端刚部署好就会被强制弹回官方站。自定义域请把域名加到这里。
        if (/(^|\.)github\.io$/i.test(currentHost)) return;

        if (currentHost !== officialHost) {
          window.location.replace('https://' + officialHost + window.location.pathname + window.location.search);
        }
      })();
    </script>
